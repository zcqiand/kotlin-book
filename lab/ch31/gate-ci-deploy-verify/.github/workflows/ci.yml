name: ci

# 教学件：复刻案例仓 lab-management-system-kotlin `.github/workflows/ci.yml` 的门控骨架，
# 裁剪为四级门控最小形态（本 lab 无 Ktor 面，故无镜像装配冒烟步）。
# 案例仓结构 = ①ktfmtCheck ②detekt ③test 三件同跑 + 镜像冒烟 + tag 触发 deploy；
# 本件 = 四级各显式一步（方便对照章内四级流水线图）+ 复用 deploy 镜像推送骨架。
# 环境注记：案例仓测试 env 全量显式注入（suite 硬规则 §1：占位也是显式提供）；
# 本工程 db-check 冒烟走 postgres:16 service 容器，库名/用户名带 _ch31_verify 隔离后缀。
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

jobs:
  gate:
    runs-on: ubuntu-latest
    services:
      # 四级门控之外的真连接验证：PG 16 service 容器（隔离命名 _ch31_verify）
      pg_ch31_verify:
        image: postgres:16
        env:
          POSTGRES_DB: lab_ch31_verify
          POSTGRES_USER: lab_ch31_verify
          POSTGRES_PASSWORD: ch31_verify
        ports:
          - 15439:5432
        options: >-
          --health-cmd "pg_isready -U lab_ch31_verify"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: L1 格式门 — ktfmtCheck
        run: ./gradlew --no-daemon ktfmtCheck
      - name: L2 静态门 — detekt
        run: ./gradlew --no-daemon detekt
      - name: L3 测试门 — test
        run: ./gradlew --no-daemon test
      - name: L4 构建门 — build
        run: ./gradlew --no-daemon build
      - name: db-check — 真连 PG 16 建表/插数/select
        env:
          DATABASE_URL: postgresql://lab_ch31_verify:ch31_verify@127.0.0.1:15439/lab_ch31_verify
        run: ./gradlew --no-daemon run --args="db-check"

  # 部署链：镜像案例仓 ci.yml 的 deploy job 骨架（tag 触发 → Docker Hub 推送 → SSH 拉起）。
  # 教学件保留占位 secrets 名，实际仓库接法见案例仓 deploy 步骤注释。
  deploy:
    runs-on: ubuntu-latest
    needs: gate
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:${{ github.ref_name }}
