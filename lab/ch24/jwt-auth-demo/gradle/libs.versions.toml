# 版本目录：全工程版本唯一事实源（version-lock 口径：Kotlin 2.4.21 / Ktor 3.6.0（ktor-bom
# 收口）/ jjwt 0.12.6（api 显式 + impl/jackson runtimeOnly）/ kotlinx-serialization 1.9.0 /
# slf4j 2.0.16（api + simple））。
# Ktor 各模块版本由 ktor-bom 收口（见 build.gradle.kts 的 platform 引入），这里给每个
# Ktor 模块写 version.ref 只是为了目录自身合法，实际约束以 BOM 为准——沿 ch22 先例。
[versions]
kotlin = "2.4.21"
ktor = "3.6.0"
jjwt = "0.12.6"
kotlinxSerialization = "1.9.0"
slf4j = "2.0.16"

[libraries]
ktor-bom = { module = "io.ktor:ktor-bom", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-auth = { module = "io.ktor:ktor-server-auth", version.ref = "ktor" }
ktor-server-auth-jwt = { module = "io.ktor:ktor-server-auth-jwt", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
jjwt-api = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jjwt" }
jjwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jjwt" }
jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
