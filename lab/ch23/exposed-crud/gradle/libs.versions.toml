# 版本目录：全工程版本唯一事实源（version-lock 口径：Kotlin 2.4.21 / Exposed 1.5.1 /
# r2dbc-postgresql 1.1.3.RELEASE / junit 6.1.3 / kotlinx-coroutines 1.11.0 / slf4j 2.0.16）。
# Exposed 各模块版本由 exposed-bom 收口（禁在依赖坐标上裸写版本），这里写 exposed
# 只为 BOM 坐标自身合法——沿 ch22 ktor-bom 先例。
[versions]
kotlin = "2.4.21"
exposed = "1.5.1"
r2dbcPostgresql = "1.1.3.RELEASE"
kotlinxCoroutines = "1.11.0"
slf4j = "2.0.16"
junit = "6.1.3"

[libraries]
exposed-bom = { module = "org.jetbrains.exposed:exposed-bom", version.ref = "exposed" }
exposed-core = { module = "org.jetbrains.exposed:exposed-core" }
exposed-r2dbc = { module = "org.jetbrains.exposed:exposed-r2dbc" }
r2dbc-postgresql = { module = "org.postgresql:r2dbc-postgresql", version.ref = "r2dbcPostgresql" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-engine = { module = "org.junit.platform:junit-platform-engine" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
