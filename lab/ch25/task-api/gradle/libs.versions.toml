# 版本目录（本书第五个 version catalog）：全工程版本唯一事实源（version-lock 口径：
# Kotlin 2.4.21 / Ktor 3.6.0（ktor-bom 收口）/ Exposed 1.5.1（exposed-bom 收口，包名
# org.jetbrains.exposed.v1.*）/ r2dbc-postgresql 1.1.3.RELEASE / jjwt 0.12.6（api 显式 +
# impl/jackson runtimeOnly）/ kotlinx-serialization 1.9.0 / kotlinx-coroutines 1.11.0 /
# junit 6.1.3（junit-bom）/ slf4j 2.0.16（api + simple）/ ktfmt 0.27.0 / detekt 1.23.8）。
# ktfmt 与 detekt 两个门控插件版本沿 ch21 既定形态照抄不新造；Ktor/exposed 各模块版本
# 分别由两侧 BOM 收口，目录里写 version.ref 只为坐标自身合法——沿 ch22/ch23 先例。
[versions]
kotlin = "2.4.21"
ktor = "3.6.0"
exposed = "1.5.1"
r2dbcPostgresql = "1.1.3.RELEASE"
jjwt = "0.12.6"
kotlinxSerialization = "1.9.0"
kotlinxCoroutines = "1.11.0"
slf4j = "2.0.16"
junit = "6.1.3"
ktfmt = "0.27.0"
detekt = "1.23.8"

[libraries]
ktor-bom = { module = "io.ktor:ktor-bom", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-auth = { module = "io.ktor:ktor-server-auth", version.ref = "ktor" }
ktor-server-auth-jwt = { module = "io.ktor:ktor-server-auth-jwt", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
exposed-bom = { module = "org.jetbrains.exposed:exposed-bom", version.ref = "exposed" }
exposed-core = { module = "org.jetbrains.exposed:exposed-core" }
exposed-r2dbc = { module = "org.jetbrains.exposed:exposed-r2dbc" }
r2dbc-postgresql = { module = "org.postgresql:r2dbc-postgresql", version.ref = "r2dbcPostgresql" }
jjwt-api = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jjwt" }
jjwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jjwt" }
jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-engine = { module = "org.junit.platform:junit-platform-engine" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktfmt = { id = "com.ncorti.ktfmt.gradle", version.ref = "ktfmt" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
