# 版本目录：全工程版本唯一事实源（沿 ch33 tenant-isolation-lab 同款基线 + 新增 jjwt 三件，
# 版本号 0.12.6 只出现在本文件，build.gradle.kts 禁裸写版本）。
[versions]
kotlin = "2.4.21"
exposed = "1.5.1"
r2dbcPostgresql = "1.1.3.RELEASE"
kotlinxCoroutines = "1.11.0"
slf4j = "2.0.16"
jjwt = "0.12.6"

[libraries]
exposed-bom = { module = "org.jetbrains.exposed:exposed-bom", version.ref = "exposed" }
exposed-core = { module = "org.jetbrains.exposed:exposed-core" }
exposed-kotlin-datetime = { module = "org.jetbrains.exposed:exposed-kotlin-datetime" }
exposed-r2dbc = { module = "org.jetbrains.exposed:exposed-r2dbc" }
r2dbc-postgresql = { module = "org.postgresql:r2dbc-postgresql", version.ref = "r2dbcPostgresql" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
jjwt-api = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jjwt" }
jjwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jjwt" }
jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
